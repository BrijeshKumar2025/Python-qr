
<!DOCTYPE html>
<html>
<head>
    <title>QR Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="text-center mt-20">

    <h1 class="text-3xl font-bold color-red">QR Generator</h1>
    <h1 class="text-2xl font-italic">Enter your URL below:</h1>

    <form action="/generate" method="get">
        <input type="text" name="url" placeholder="Enter URL"
            class="border p-2" required>

        <button class="bg-gray-500 text-black p-2">
            Generate your QR
        </button>
    </form>
    <div class="mt-5">

    {% if qr %}
        <h2 class="text-xl font-bold mb-3">Your QR Code</h2>

        <img src="{{ qr }}" 
             width="200" 
             class="mx-auto border p-2">

    </br>
    <p class="mt-3">
    Your QR code is generated.
</p>

<button class="bg-gray-500 text-black p-2">
    <a href="/download"
   class="inline-block mt-4 bg-green-500 text-white p-3 rounded">
    Download QR Code
      </a>
</button>
    {% endif %}

</div>

</body>
</html>
